name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-26
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      # The package has no swift-docc-plugin dependency (XCTest only), and the UI helpers build for
      # iOS alone, so the archive comes from xcodebuild for the iOS Simulator.
      - name: Generate Documentation
        run: |
          xcodebuild docbuild -scheme swift-store-shots \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc
          ARCHIVE=$(find .build/docc -name 'StoreShots.doccarchive' -type d | head -1)
          $(xcrun --find docc) process-archive transform-for-static-hosting "$ARCHIVE" \
            --hosting-base-path swift-store-shots \
            --output-path ./docs

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
